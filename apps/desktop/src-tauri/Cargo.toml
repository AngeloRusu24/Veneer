[package]
name = "veneer-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
veneer-core = { path = "../../../crates/core" }
veneer-diagnostics = { path = "../../../crates/diagnostics" }
veneer-ipc = { path = "../../../crates/ipc" }
veneer-rule-engine = { path = "../../../crates/rule-engine" }
veneer-windows-platform = { path = "../../../crates/windows-platform" }
tracing = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
