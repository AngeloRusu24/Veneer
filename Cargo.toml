[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/diagnostics",
    "crates/ipc",
    "crates/rule-engine",
    "crates/state-journal",
    "crates/theme-schema",
    "crates/windows-platform",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
